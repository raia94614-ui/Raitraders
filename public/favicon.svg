<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D18B"/>
      <stop offset="50%" stop-color="#D6A34D"/>
      <stop offset="100%" stop-color="#9C6F28"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061522"/>
      <stop offset="100%" stop-color="#0A1D30"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Architectural Roof Peak Motif -->
  <path d="M50 16 L74 34 L70 37 L50 22 L30 37 L26 34 Z" fill="url(#goldGrad)"/>
  
  <!-- Subtle Chimney / Finial detail -->
  <circle cx="50" cy="18" r="2.5" fill="url(#goldGrad)"/>

  <!-- Monogram RT -->
  <g fill="url(#goldGrad)" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700">
    <!-- Letter R -->
    <text x="31" y="68" font-size="34" letter-spacing="-1">R</text>
    <!-- Letter T -->
    <text x="52" y="68" font-size="34" letter-spacing="-1">T</text>
  </g>
  
  <!-- Underline Accent -->
  <path d="M28 76 L72 76" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="76" r="2.5" fill="#F3D18B"/>
</svg>